<!DOCTYPE html>
<html>
<head>
    <title>Box Model 1</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Color Grid</h1>

    <div class="artwork">

        <!-- Top color grid -->
        <div class="top-grid">
            <div class="square top-left"></div>
            <div class="square top-right"></div>
            <div class="square middle-left"></div>
            <div class="square middle-right"></div>
            <div class="square bottom-left"></div>
            <div class="square bottom-right"></div>
        </div>

        <!-- Bottom color grid -->
        <div class="bottom-grid">
            <div class="square bottom-left-grid"></div>
            <div class="square bottom-right-grid"></div>
            <div class="square center-left"></div>
            <div class="square center-right"></div>
            <div class="square small-left"></div>
            <div class="square small-right"></div>
        </div>

    </div>

</body>
</html>
